name: app-snapshot

on:
  workflow_call:
    inputs:
      clear-cache:
        description: "'true' pra limpar o cache do Nuitka antes de rodar (rebuild limpo)"
        required: false
        type: boolean
        default: false

jobs:
  snapshot-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.snapshot.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: snapshot
        name: snapshot-version
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/snapshot-version@v2

  app-build:
    needs: snapshot-version
    runs-on: windows-latest
    permissions:
      actions: write
    outputs:
      exe-path: ${{ steps.build.outputs.exe-path }}
      app-name: ${{ steps.build.outputs.app-name }}
    steps:
      - uses: actions/checkout@v7

      - id: build
        name: app-build
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/app-build@v2
        with:
          clear-cache: ${{ inputs.clear-cache }}

      - uses: actions/upload-artifact@v7
        with:
          name: exe
          path: ${{ steps.build.outputs.exe-path }}

  release-publish:
    needs: [snapshot-version, app-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: exe
          path: dist

      - id: zip
        name: to-zip
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/to-zip@v2
        with:
          path: dist/${{ needs.app-build.outputs.app-name }}.exe

      # Pre-release publicada (não draft) para quem for validar conseguir baixar. A tag nasce no
      # commit que gerou o build, não na ponta da branch padrão.
      - uses: Maria-Cacau/Maria-Cacau-Actions/actions/git/release-publish@v2
        with:
          version: ${{ needs.snapshot-version.outputs.tag }}
          asset-path: ${{ steps.zip.outputs.zip-path }}
          prerelease: 'true'
          target: ${{ github.sha }}
          notes: |
            Snapshot de validação — não é uma release.

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/git/actions-notice@v2
        with:
          title: Snapshot
          message: "Pre-release ${{ needs.snapshot-version.outputs.tag }} publicada: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.snapshot-version.outputs.tag }}"
