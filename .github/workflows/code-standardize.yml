name: code-standardize

on:
  workflow_call:
    inputs:
      path:
        description: Caminho a padronizar
        required: false
        default: '.'
        type: string

jobs:
  standardize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: isort
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/isort-fix@v2
        id: isort
        with:
          path: ${{ inputs.path }}

      - name: graphify
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/graphify-update@v2
        id: graphify
        with:
          path: ${{ inputs.path }}

      - name: Summary
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/git/actions-notice@v2
        with:
          title: Summary
          message: "isort: ${{ steps.isort.outputs.count }} arquivo(s) | graphify: ${{ steps.graphify.outputs.count }} arquivo(s)"

      - name: Commit
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/git/commit-bot@v2
        with:
          message: "chore: isort + graphify [skip ci]"
