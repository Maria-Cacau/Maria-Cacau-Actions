# TODO: remover "[test] " do name e o trigger workflow_dispatch antes do merge na main
name: "[test] code-standardize"

on:
  workflow_dispatch:
    inputs:
      path:
        description: Caminho a padronizar
        required: false
        default: '.'
        type: string
  workflow_call:
    inputs:
      path:
        description: Caminho a padronizar
        required: false
        default: '.'
        type: string

jobs:
  standardize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./actions/isort-fix
        id: isort
        with:
          path: ${{ inputs.path }}
