name: code-standardize

on:
  workflow_call:
    inputs:
      path:
        description: Caminho a padronizar
        required: false
        default: '.'
        type: string

jobs:
  standardize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Maria-Cacau-Actions
        uses: actions/checkout@v7
        shell: bash

      - name: Setup
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: isort
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/isort-fix@v1
        id: isort
        with:
          path: ${{ inputs.path }}

      - name: graphify
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/graphify-update@v1
        id: graphify
        with:
          path: ${{ inputs.path }}

      - name: Summary
        env:
          NOTICE_TITLE: Summary
          NOTICE: "isort: ${{ steps.isort.outputs.count }} arquivo(s) | graphify: ${{ steps.graphify.outputs.count }} arquivo(s)"
        run: bash ${{ github.workspace }}/.maria-cacau-actions/scripts/notice.sh
        shell: bash

      - name: Commit
        env:
          COMMIT_MESSAGE: "chore: isort + graphify [skip ci]"
        run: bash ${{ github.workspace }}/.maria-cacau-actions/scripts/commit.sh
        shell: bash
