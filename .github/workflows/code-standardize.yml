# TODO: remover "[test] " do name e o trigger workflow_dispatch antes do merge na main
name: "[test] code-standardize"

on:
  workflow_dispatch:
    inputs:
      path:
        description: Caminho a padronizar
        required: false
        default: '.'
        type: string
  workflow_call:
    inputs:
      path:
        description: Caminho a padronizar
        required: false
        default: '.'
        type: string

jobs:
  standardize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: isort
        uses: ./actions/isort-fix
        id: isort
        with:
          path: ${{ inputs.path }}

      - name: graph
        uses: ./actions/graphify-update
        id: graphify
        with:
          path: ${{ inputs.path }}

      # Gera o notice final e comita as mudanças do isort/graph (se houver).
      # scripts/finish.sh é genérico (notice + commit + push) — reaproveitável por
      # outros reusable workflows deste repo, não é exclusivo do code-standardize.
      - name: Finish
        env:
          NOTICE_TITLE: code-standardize
          NOTICE: "isort: ${{ steps.isort.outputs.count }} arquivo(s) | graphify: ${{ steps.graphify.outputs.count }} arquivo(s)"
          COMMIT_MESSAGE: "chore: isort + graphify [skip ci]"
        run: bash ${{ github.workspace }}/scripts/finish.sh
        shell: bash
