# TODO: as 4 self-referências pra @1.1-Test abaixo (branch-check, check-version,
# release-publish, tag-delete) voltam pra @v1 antes do merge na main.
name: publish-release

on:
  workflow_call: {}

jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: check-branch
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/git/branch-check@1.1-Test

      - id: check
        name: check-version
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/check-version@1.1-Test
        env:
          GH_TOKEN: ${{ github.token }}

  release-publish:
    needs: validation
    if: needs.validation.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: Maria-Cacau/Maria-Cacau-Actions/actions/git/release-publish@1.1-Test
        with:
          version: ${{ needs.validation.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: delete-test-tag
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/git/tag-delete@1.1-Test
        with:
          version: ${{ needs.validation.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
