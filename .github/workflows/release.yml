# TODO: as 4 self-referências pra @1.1-Test abaixo (check-version, build,
# nuitka, release) voltam pra @v1 antes do merge na main.
name: release

on:
  workflow_call: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/check-version@1.1-Test
        env:
          GH_TOKEN: ${{ github.token }}

  distribute:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    outputs:
      exe-path: ${{ steps.dist.outputs.exe-path }}
      app-name: ${{ steps.dist.outputs.app-name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Cache do objeto compilado (clcache/Nuitka) entre runs — sem isso toda
      # run recompila do zero, já que o runner é uma VM nova sempre.
      - uses: actions/cache@v6
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - id: build
        name: build
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/build@1.1-Test
        with:
          args: build

      - id: dist
        name: nuitka
        uses: Maria-Cacau/Maria-Cacau-Actions/actions/nuitka@1.1-Test
        with:
          python: ${{ steps.build.outputs.python }}

      - uses: actions/upload-artifact@v7
        with:
          name: exe
          path: ${{ steps.dist.outputs.exe-path }}

  release:
    needs: [check-version, distribute]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: exe
          path: dist

      - uses: Maria-Cacau/Maria-Cacau-Actions/actions/release@1.1-Test
        with:
          version: ${{ needs.check-version.outputs.version }}
          exe-path: dist/${{ needs.distribute.outputs.app-name }}.exe
        env:
          GH_TOKEN: ${{ github.token }}
