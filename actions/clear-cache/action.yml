name: clear-cache
description: >
  Apaga uma entrada de cache do Actions por chave (silencioso se não existir). Requer a variável
  de ambiente GH_TOKEN definida por quem chama esta action.

inputs:
  key:
    description: Chave do cache a apagar
    required: true

runs:
  using: composite
  steps:
    - name: Apagar cache
      run: python "${{ github.action_path }}"/clear_cache.py "${{ inputs.key }}"
      shell: bash
