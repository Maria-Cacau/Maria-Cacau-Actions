name: actions-notice
description: "Emite uma annotation de notice (só se a mensagem estiver definida)."

inputs:
  title:
    description: Título da annotation
    required: false
    default: 'notice'
  message:
    description: Mensagem da annotation (se vazio, não emite nada)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Emitir notice
      run: bash "${{ github.action_path }}"/notice.sh
      shell: bash
      env:
        NOTICE_TITLE: ${{ inputs.title }}
        NOTICE: ${{ inputs.message }}
