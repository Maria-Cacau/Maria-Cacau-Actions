name: isort-fix
description: Ajusta a ordenação dos imports Python com isort. Assume que o Python já foi
  configurado antes (via actions/setup-python) por quem chama esta action.

inputs:
  path:
    description: Caminho a rodar o isort
    required: false
    default: '.'

outputs:
  changed:
    description: "'true' se o isort alterou algum arquivo"
    value: ${{ steps.run.outputs.changed }}
  count:
    description: "Quantidade de arquivos alterados"
    value: ${{ steps.run.outputs.count }}

runs:
  using: composite
  steps:
    - name: Instalar isort
      run: pip install isort
      shell: bash

    - id: run
      name: Rodar isort
      run: python "${{ github.action_path }}"/run_isort.py "${{ inputs.path }}"
      shell: bash
