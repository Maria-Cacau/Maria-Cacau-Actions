name: release
description: >
  Cria/reaproveita a release em draft, preenche a descrição a partir do PR mergeado (se as notes
  ainda estiverem vazias) e sobe o asset. Requer a variável de ambiente GH_TOKEN definida por quem
  chama esta action.

inputs:
  version:
    description: Versão da release (sem 'v')
    required: true
  exe-path:
    description: Caminho do .exe a subir como asset
    required: true

runs:
  using: composite
  steps:
    - name: Criar/atualizar release
      run: python "${{ github.action_path }}"/release.py "${{ inputs.version }}" "${{ inputs.exe-path }}"
      shell: bash
